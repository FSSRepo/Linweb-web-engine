<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .box {
            width: 100px;
            height: 100px;
            background-color: #e74c3c;
            margin: 50px auto;
            border-radius: 10px;
            animation: bounce 2s infinite ease-in-out;
        }
        .rotate-box {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            margin: 50px auto;
            border-radius: 10px;
            animation: spinscale 3s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-80px); }
        }
        @keyframes spinscale {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.3); }
            100% { transform: rotate(360deg) scale(1); }
        }
    </style>
</head>
<body>
    <h1>Keyframes + Transform Test</h1>
    <p>The red box should bounce up and down</p>
    <div class="box"></div>
    <p>The blue box should rotate and scale</p>
    <div class="rotate-box"></div>
</body>
</html>
