<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        .container {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: #2c3e50;
            margin: 30px auto;
        }
        .box {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .red {
            background-color: rgba(231, 76, 60, 0.9);
            top: 40px;
            left: 40px;
            z-index: 1;
        }
        .blue {
            background-color: rgba(52, 152, 219, 0.9);
            top: 80px;
            left: 80px;
            z-index: 2;
        }
        .green {
            background-color: rgba(46, 204, 113, 0.9);
            top: 120px;
            left: 120px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <h1>z-index Test</h1>
    <p>Green should be on top, then Blue, then Red</p>
    <div class="container">
        <div class="box red">z-index: 1</div>
        <div class="box blue">z-index: 2</div>
        <div class="box green">z-index: 3</div>
    </div>
</body>
</html>
