<html>
<head>
    <style>
        .small { font-size: 12px; }
        .normal { font-size: 16px; }
        .large { font-size: 32px; }
        .xlarge { font-size: 64px; }
        .box { background-color: #e0e0e0; margin: 10px; padding: 5px; }
    </style>
</head>
<body>
    <div class="box small">This is small text (12px)</div>
    <div class="box normal">This is normal text (16px)</div>
    <div class="box large">This is large text (32px)</div>
    <div class="box xlarge">This is extra large text (64px)</div>
    <div class="box" style="font-size: 24px;">This is inline styled text (24px)</div>
</body>
</html>
