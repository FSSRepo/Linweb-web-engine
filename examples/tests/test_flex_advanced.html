<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .flex-container {
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 300px;
            background-color: #34495e;
            border-radius: 10px;
            padding: 20px;
        }
        .flex-item {
            width: 80px;
            height: 80px;
            background-color: #3498db;
            border-radius: 8px;
            text-align: center;
            line-height: 80px;
        }
        .item-self-end {
            align-self: flex-end;
            background-color: #e74c3c;
        }
        .item-self-start {
            align-self: flex-start;
            background-color: #2ecc71;
        }
        .will-change-box {
            width: 100px;
            height: 100px;
            background-color: #f1c40f;
            margin-top: 30px;
            border-radius: 8px;
            will-change: transform;
            transition: transform 0.5s ease;
        }
        .will-change-box:hover {
            transform: scale(1.2) rotate(10deg);
        }
    </style>
</head>
<body>
    <h1>Advanced Flexbox Test</h1>
    <p>align-self: start (green), center (blue), end (red)</p>
    <div class="flex-container">
        <div class="flex-item item-self-start">Start</div>
        <div class="flex-item">Center</div>
        <div class="flex-item item-self-end">End</div>
    </div>
    <p>Hover the yellow box to test will-change + transform</p>
    <div class="will-change-box">Scale</div>
</body>
</html>
