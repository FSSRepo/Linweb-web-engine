<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        .scroll-container {
            width: 300px;
            height: 200px;
            background-color: #ecf0f1;
            color: #2c3e50;
            overflow: scroll;
            padding: 20px;
            margin: 30px auto;
            border-radius: 8px;
        }
        .scroll-item {
            height: 60px;
            margin: 10px 0;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            text-align: center;
            line-height: 60px;
        }
    </style>
</head>
<body>
    <h1>Overflow Scroll Test</h1>
    <p>Scroll with mouse wheel to see custom scrollbar</p>
    <div class="scroll-container">
        <div class="scroll-item">Item 1</div>
        <div class="scroll-item">Item 2</div>
        <div class="scroll-item">Item 3</div>
        <div class="scroll-item">Item 4</div>
        <div class="scroll-item">Item 5</div>
        <div class="scroll-item">Item 6</div>
        <div class="scroll-item">Item 7</div>
        <div class="scroll-item">Item 8</div>
    </div>
</body>
</html>
