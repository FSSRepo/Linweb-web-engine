<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Select</title>
    <style>
        body { font-family: sans-serif; margin: 24px; background: #f5f5f5; color: #222; }
    </style>
</head>
<body>
    <h2>Select (native look)</h2>
    <div>
        <select id="fruit">
            <option value="apple">Apple</option>
            <option value="pear" selected>Pear</option>
            <option value="banana">Banana</option>
        </select>
    </div>
    <p id="out">Waiting for the script...</p>

    <script>
        var fruit = document.getElementById('fruit');
        var out = document.getElementById('out');

        function show(why) {
            out.innerText = why + ': value=' + fruit.value + ' changes=' + (window.changes || 0);
            console.log('select-check ' + out.innerText);
        }

        window.changes = 0;
        fruit.addEventListener('change', function () {
            window.changes = (window.changes || 0) + 1;
            show('change');
        });
        show('start');
    </script>
</body>
</html>
