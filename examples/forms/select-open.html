<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Select open</title>
    <style>
        body { font-family: sans-serif; margin: 24px; background: #f5f5f5; color: #222; }
    </style>
</head>
<body>
    <h2>Select with its list open</h2>
    <select id="fruit">
        <option value="apple">Apple</option>
        <option value="pear">Pear</option>
        <option value="banana">Banana</option>
    </select>

    <script>
        var fruit = document.getElementById('fruit');
        fruit.value = 'pear';
        fruit.showPicker();
        console.log('select-open value=' + fruit.value);
    </script>
</body>
</html>
