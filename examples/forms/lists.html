<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="../fonts/fonts.css">
    <meta charset="utf-8">
    <title>Lists</title>
    <style>
        body { font-family: sans-serif; margin: 24px; background: #f5f5f5; color: #222; }
    </style>
</head>
<body>
    <h2>Unordered</h2>
    <ul>
        <li>First item</li>
        <li>Second item
            <ul>
                <li>Nested one</li>
                <li>Nested two</li>
            </ul>
        </li>
        <li>Third item</li>
    </ul>

    <h2>Ordered</h2>
    <ol>
        <li>Open the file</li>
        <li>Choose a page</li>
        <li>Read it</li>
    </ol>
</body>
</html>
