<html>
  <head>
    <link rel="stylesheet" href="examples.css">
  </head>
  <body class="examples-body">
    <h1>CSS Examples</h1>

    <div>
      <h2>Flexbox Example</h2>
      <div class="flex-container">
        <div class="flex-item item1">1</div>
        <div class="flex-item item2">2</div>
        <div class="flex-item item3">3</div>
      </div>
    </div>

    <div>
      <h2>Position Example</h2>
      <div class="relative-box">
        Relative Box (top/left 20px)
        <div class="absolute-box">Absolute</div>
      </div>
      <div class="fixed-box">Fixed</div>
    </div>

    <div>
      <h2>Filter Example</h2>
      <div class="filter-container">
        <div class="filter-box blur-box">Blur</div>
        <div class="filter-box invert-box">Invert</div>
        <div class="filter-box shadow-box">Shadow</div>
      </div>
    </div>
    <img src="assets/pages/image.png" width="300" style="margin-right: 10px;"></img>
    <img src="assets/pages/test.png" width="300" ></img>
  </body>
</html>
