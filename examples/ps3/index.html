<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS3 WebOS App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>PS3 WebOS App</h1>
        </header>
        <main>
            <div id="xmb-container">
                <nav id="main-menu">
                    <div class="menu-item" data-name="System">
                        <img src="system.svg" alt="System" class="menu-icon">
                        <span>System</span>
                    </div>
                    <div class="menu-item" data-name="Games">
                        <img src="games.svg" alt="Games" class="menu-icon">
                        <span>Games</span>
                    </div>
                    <div class="menu-item" data-name="Multimedia">
                        <img src="music.svg" alt="Multimedia" class="menu-icon">
                        <span>Multimedia</span>
                    </div>
                    <div class="menu-item" data-name="DVD">
                        <img src="dvd.svg" alt="DVD" class="menu-icon">
                        <span>DVD</span>
                    </div>
                </nav>
                <div id="submenu-container">
                    <!-- Los items del submenú se cargarán aquí dinámicamente -->
                </div>
            </div>
            <div id="status">Aplicación lista</div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
