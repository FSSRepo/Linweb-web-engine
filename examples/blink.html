<html>

<head>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 50px;
        }

        .container {
            display: block;
            margin: 0 auto;
            width: 80%;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: #e74c3c;
            margin: 40px auto;
            border-radius: 20px;
            display: block;
            line-height: 200px;
            font-size: 24px;
            font-weight: bold;
        }

        .blink-text {
            color: #f1c40f;
            font-size: 48px;
            margin-bottom: 20px;
            animation: blink 1.5s ease infinite;
        }

        .blink-box {
            animation: blink 2s ease infinite;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .static-box {
            background-color: #3498db;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="blink-text">WARNING: BLINKING!</h1>
        <p>This page demonstrates the new built-in blink animation.</p>

        <div class="box blink-box">I'M BLINKING</div>
        <div class="box static-box">I'M NOT</div>

        <p>The animation affects the 'opacity' property smoothly.</p>
    </div>
</body>

</html>
