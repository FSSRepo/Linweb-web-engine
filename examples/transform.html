<html>
<head>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial;
        }
        .container {
            padding: 50px;
            display: block;
        }
        .box {
            width: 150px;
            height: 150px;
            background-color: #3498db;
            color: white;
            display: block;
            margin: 40px;
            border-radius: 10px;
            text-align: center;
            line-height: 150px;
            transition: all 0.5s ease;
        }
        
        .box:hover {
            background-color: #e74c3c;
        }

        .rotate:hover {
            transform: rotate(45deg);
        }

        .scale:hover {
            transform: scale(1.5);
        }

        .translate:hover {
            transform: translate(50px, 0px);
        }

        .combined:hover {
            transform: translate(20px, 20px) rotate(20deg) scale(1.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSS Transforms Demo</h1>
        <p>Hover over the boxes to see transformations in action!</p>
        
        <div class="box rotate">Rotate 45deg</div>
        <div class="box scale">Scale 1.5x</div>
        <div class="box translate">Translate 50px</div>
        <div class="box combined">Combined</div>
    </div>
</body>
</html>
